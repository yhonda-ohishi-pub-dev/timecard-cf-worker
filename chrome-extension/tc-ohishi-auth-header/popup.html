<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tc-ohishi Auth Header</title>
<style>
  body {
    width: 340px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    padding: 12px;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 8px;
  }
  label {
    display: block;
    margin-top: 8px;
    font-weight: bold;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    padding: 6px 0;
  }
  #status {
    margin-top: 8px;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .host {
    color: #666;
    font-size: 11px;
  }
</style>
</head>
<body>
  <h1>tc-ohishi.mtamaramu.com Auth Header</h1>
  <div class="host">対象ホスト: tc-ohishi.mtamaramu.com / Cookie: tc_session</div>

  <div class="row">
    <input type="checkbox" id="enabled">
    <label for="enabled" style="margin:0;">注入を有効にする</label>
  </div>

  <div class="buttons">
    <button id="capture">現在のログインを保存</button>
  </div>
  <div class="buttons">
    <button id="test">動作確認</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
